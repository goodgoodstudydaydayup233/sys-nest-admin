# 开发环境配置

# 应用配置
app:
  # 超级管理员用户名，跳过权限校验
  admin: admin
  # 全局接口前缀（开发环境）
  apiPrefix: dev-api

# 服务器配置
server:
  port: 3000

# Swagger 文档配置
swagger:
  # Swagger Servers 中展示的基础地址（需包含环境前缀）
  serverUrl: http://localhost:3000/dev-api

# 限流配置
# 三层限流策略：
# - global：全局总请求数限流，不分 IP 不分接口，保护服务器整体 QPS（默认 60秒5000次）
# - default：按"接口 + IP"维度，防止单 IP 刷单接口（默认 60秒100次）
# - ip：按"IP"维度，防止单 IP 刷所有接口（默认 60秒1000次）
# 方法上标注 @RateLimiter 装饰器可覆盖 default 配置
rateLimit:
  # 是否启用限流
  enabled: true
  # 全局总请求数限流（不分 IP、不分接口）
  global:
    # 时间窗口（秒）
    time: 60
    # 时间窗口内最大请求次数
    count: 5000
  # 默认限流（按"接口 + IP"维度）
  default:
    # 时间窗口（秒）
    time: 60
    # 时间窗口内最大请求次数
    count: 100
  # 单一 IP 全局限流（按"IP"维度）
  ip:
    # 时间窗口（秒）
    time: 60
    # 时间窗口内最大请求次数
    count: 10000

# 上传文件配置
upload:
  # 上传文件保存路径
  dest: ./uploads
  # 单文件最大大小 (MB)
  maxSize: 10

# 数据库配置
database:
  type: mysql
  host: localhost
  port: 3306
  username: root
  password: '123456'
  database: sys_nest_server
  synchronize: true
  logging: false

# Redis配置
redis:
  host: localhost
  port: 6379
  password: ''
  db: 1

# JWT配置
jwt:
  secret: sys-nest-jwt-secret-dev
  # 长token (用于刷新)
  refreshSecret: sys-nest-jwt-refresh-secret-dev
  # 短token过期时间 (用于访问)
  accessTokenExpiresIn: 2h
  # 长token过期时间 (用于刷新)
  refreshTokenExpiresIn: 7d

# 验证码配置
captcha:
  # 验证码过期时间 (秒)
  expiresIn: 300

# 请求白名单配置
whitelist:
  # 不需要认证的接口
  paths:
    - /dev-api/auth/login
    - /dev-api/auth/refresh
    - /dev-api/captcha
  # 不需要认证的前缀
  prefixes:
    - /api
    - /swagger

# Redis键配置
redisKeys:
  # 用户信息缓存
  user:
    prefix: 'user:info:'
    expiresIn: 86400
  # 验证码
  captcha:
    prefix: 'captcha:'
    expiresIn: 300
  # Token黑名单
  tokenBlacklist:
    prefix: 'token:blacklist:'
    expiresIn: 604800
  # 字典数据缓存（按字典类型 type 缓存）
  dict:
    prefix: 'dict:data:'
    expiresIn: 0 # 0 表示永久缓存，由 CRUD 主动失效
